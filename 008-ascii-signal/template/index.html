<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在浏览器本地将图片转换为可复制的 ASCII Art。">
  <title>ASCII Signal · 图片转字符画</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23151a16'/%3E%3Cpath d='M11 20h42M11 32h42M11 44h42' stroke='%2361a86d' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="ui-shell.css">
  <style>
    :root {
      --lab-paper: oklch(95.6% .012 145);
      --lab-panel: oklch(97.2% .008 145);
      --lab-ink: oklch(18.5% .014 145);
      --lab-muted: oklch(47% .018 145);
      --lab-line: oklch(79% .016 145);
      --lab-accent: oklch(64% .115 145);
      --lab-alert: oklch(58% .17 28);
      --lab-stage-bg: oklch(18.5% .014 145);
      --lab-stage-ink: oklch(96% .008 145);
      --lab-stage-rule: oklch(96% .008 145 / .22);
      --lab-panel-width: 356px;
      --signal-ink: oklch(96% .01 75);
      --signal-paper: oklch(18.5% .018 55);
    }

    .lab-panel__header { padding-block: 22px 24px; background: var(--lab-panel); }
    .lab-panel__header h1 { max-width: 12ch; font-size: clamp(2.2rem, 3.5vw, 3rem); }
    .lab-panel__header::after, .lab-panel__header::before { content: none; }
    .lab-section { padding-block: 20px 22px; }
    .lab-section__heading { margin-bottom: 16px; }
    .lab-section__heading h2 { font-size: .75rem; }
    .lab-field input[type="text"], .lab-field select { font-family: var(--lab-font-data); }
    .lab-segmented { grid-auto-flow: initial; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .lab-segmented button { padding-inline: 5px; font-size: .65rem; letter-spacing: .02em; }
    .lab-check + .lab-check { border-top: 1px solid var(--lab-line); }
    .lab-action { min-height: 60px; }
    .lab-action--wide { grid-column: span 2; border-top: 1px solid var(--lab-ink); }
    .upload-card { display: grid; place-items: center; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--lab-ink); background: var(--lab-accent); cursor: pointer; font: 800 .75rem/1 var(--lab-font-data); letter-spacing: .06em; transition: background 170ms ease, color 170ms ease; }
    .upload-card:hover { background: var(--lab-ink); color: var(--lab-panel); }
    .source-readout { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 9px; margin-top: 10px; color: var(--lab-muted); font: 700 .61rem/1 var(--lab-font-data); letter-spacing: .08em; }
    .source-readout::before { content: "IN"; display: grid; place-items: center; width: 22px; height: 18px; border: 1px solid var(--lab-line); color: var(--lab-ink); font-size: .54rem; }
    .source-readout strong { overflow: hidden; color: var(--lab-ink); text-overflow: ellipsis; white-space: nowrap; font: inherit; }
    .output-switch { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--lab-ink); }
    .output-switch button { min-height: 44px; border: 0; border-right: 1px solid var(--lab-line); background: var(--lab-panel); color: var(--lab-ink); font: 800 .65rem/1 var(--lab-font-data); letter-spacing: .08em; }
    .output-switch button:last-child { border-right: 0; }
    .output-switch button.active { outline: 3px solid var(--lab-accent); outline-offset: -3px; position: relative; z-index: 1; }
    .background-switch button[data-palette="paper"] { background: #fff; color: #111; }
    .background-switch button[data-palette="black"] { background: #111; color: #fff; }

    .signal-stage { isolation: isolate; background: var(--signal-paper); color: var(--signal-ink); }
    .signal-stage::before { display: none; }
    .signal-stage .lab-stage__header { border-color: color-mix(in oklch, var(--signal-ink) 20%, transparent); }
    .signal-stage .lab-stage__meta span + span { border-color: color-mix(in oklch, var(--signal-ink) 20%, transparent); }
    .signal-stage .lab-stage__body { padding: var(--lab-header-height) 0 0; }
    .signal-stage.dragging .drop-zone { background: color-mix(in oklch, var(--lab-accent) 10%, var(--signal-paper)); }
    .signal-meta { color: var(--lab-accent); }

    .preview-shell { width: 100%; height: 100%; min-height: 0; }
    .drop-zone { min-height: 0; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; background: var(--signal-paper); transition: background 180ms ease; }
    #ascii-canvas { position: relative; z-index: 1; display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .error-line { color: var(--lab-accent); }
    .sr-output { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }

    @media (max-width: 760px) {
      .signal-stage .lab-stage__body { padding: var(--lab-header-height) 0 0; }
      .lab-panel__header { padding-block: 16px 17px; }
    }
  </style>
  <link rel="stylesheet" href="v3.css?v=10">
</head>
<body class="lab-app">
  <a class="lab-skip-link" href="#workspace">跳到画布</a>

  <aside class="lab-panel" id="control-panel" aria-label="ASCII Signal 参数面板">
    <header class="lab-panel__header">
      <div class="lab-edition">FORMULA / 008</div>
      <h1>ASCII Signal</h1>
    </header>

    <div class="lab-panel__scroll">
      <section class="lab-section" aria-labelledby="source-title">
        <div class="lab-section__heading"><span>01</span><h2 id="source-title">输入</h2></div>
        <div class="lab-field">
          <label for="image-file">图片文件</label>
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
          <button class="upload-card" id="upload-trigger" type="button">导入图像</button>
          <div class="source-readout"><strong id="source-name">内置测试图</strong></div>
        </div>
      </section>

      <section class="lab-section" aria-labelledby="grid-title">
        <div class="lab-section__heading"><span>02</span><h2 id="grid-title">取样</h2></div>
        <div class="lab-control-row">
          <label for="columns">字符宽度</label>
          <input id="columns" type="range" min="40" max="220" value="108">
          <output id="columns-output" for="columns">108</output>
        </div>
        <div class="lab-control-row">
          <label for="contrast">对比</label>
          <input id="contrast" type="range" min="60" max="180" value="108">
          <output id="contrast-output" for="contrast">108%</output>
        </div>
        <div class="lab-control-row">
          <label for="texture">细节</label>
          <input id="texture" type="range" min="0" max="1" step="0.01" value="0.72">
          <output id="texture-output" for="texture">72%</output>
        </div>
        <label class="lab-check"><input id="invert" type="checkbox"> 明暗反转</label>
      </section>

      <section class="lab-section" aria-labelledby="alphabet-title">
        <div class="lab-section__heading"><span>03</span><h2 id="alphabet-title">字符表</h2></div>
        <div class="lab-segmented" role="group" aria-label="选择字符表">
          <button class="active" type="button" data-charset="standard">标准</button>
          <button type="button" data-charset="dense">密集</button>
          <button type="button" data-charset="blocks">方块</button>
          <button type="button" data-charset="binary">二进制</button>
        </div>
        <div class="lab-field" style="margin-top:16px">
          <label for="custom-charset">自定义（暗 → 亮）</label>
          <input id="custom-charset" type="text" maxlength="64" placeholder="例如：@#*:. " autocomplete="off" spellcheck="false">
        </div>
      </section>

      <section class="lab-section" aria-labelledby="appearance-title">
        <div class="lab-section__heading"><span>04</span><h2 id="appearance-title">输出</h2></div>
        <div class="lab-field">
          <label>字符颜色</label>
          <div class="output-switch" role="group" aria-label="选择字符颜色">
            <button class="active" type="button" data-color-mode="color">彩色</button>
            <button type="button" data-color-mode="mono">黑白</button>
          </div>
        </div>
        <div class="lab-field">
          <label>背景</label>
          <div class="output-switch background-switch" role="group" aria-label="选择输出背景">
            <button class="active" type="button" data-palette="paper">白底</button>
            <button type="button" data-palette="black">黑底</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="lab-panel__actions lab-panel__actions--three-up">
      <button class="lab-action" id="copy-text" type="button"><span>复制文字</span><small>ASCII TXT</small></button>
      <button class="lab-action" id="download-text" type="button"><span>导出 TXT</span><small>文本文件</small></button>
      <button class="lab-action lab-action--wide lab-action--accent" id="download-image" type="button"><span>导出 PNG</span><small>图像文件</small></button>
    </footer>
  </aside>

  <button class="lab-panel-toggle" type="button" data-lab-panel-toggle aria-controls="control-panel" aria-expanded="true"><span aria-hidden="true">←</span></button>

  <main class="lab-stage signal-stage" id="workspace">
    <header class="lab-stage__header">
      <a class="lab-stage__id lab-gallery-link" href="../../" aria-label="返回全部实验"><i></i><span>全部实验</span></a>
      <div class="lab-stage__meta"><span id="source-meta">DEMO SOURCE</span><span class="signal-meta" id="grid-meta">108 COLS</span></div>
    </header>
    <div class="lab-stage__body">
      <div class="preview-shell">
        <section class="drop-zone" id="drop-zone" aria-label="ASCII Art 预览。可拖入图片或点击选择图片。" tabindex="0">
          <canvas id="ascii-canvas" aria-hidden="true"></canvas>
        </section>
      </div>
      <output class="sr-output" id="status-main" aria-live="polite">本地转换已就绪</output>
      <pre class="sr-output" id="ascii-text" aria-label="ASCII Art 文字结果"></pre>
    </div>
  </main>

  <script src="ui-shell.js"></script>
  <script src="default-image.js"></script>
  <script src="ascii-signal.js"></script>
</body>
</html>
